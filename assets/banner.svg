<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="FaultScout — Discover how your software system can fail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="lensClip"><circle cx="200" cy="200" r="86"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="200" cy="200" r="220" fill="url(#glow)"/>

  <!-- faint architecture graph on the right -->
  <g stroke="#1f2a44" stroke-width="2" fill="none">
    <line x1="900" y1="90" x2="1010" y2="140"/>
    <line x1="1010" y1="140" x2="1130" y2="100"/>
    <line x1="1010" y1="140" x2="990" y2="250"/>
    <line x1="1130" y1="100" x2="1180" y2="230"/>
    <line x1="990" y1="250" x2="1100" y2="300"/>
    <line x1="1180" y1="230" x2="1100" y2="300"/>
    <line x1="900" y1="90" x2="860" y2="200"/>
    <line x1="860" y1="200" x2="990" y2="250"/>
  </g>
  <g fill="#2b3a5c">
    <circle cx="900" cy="90" r="7"/>
    <circle cx="1010" cy="140" r="7"/>
    <circle cx="1130" cy="100" r="7"/>
    <circle cx="990" cy="250" r="7"/>
    <circle cx="1180" cy="230" r="7"/>
    <circle cx="1100" cy="300" r="7"/>
    <circle cx="860" cy="200" r="7"/>
  </g>
  <circle cx="990" cy="250" r="11" fill="none" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <circle cx="990" cy="250" r="20" fill="none" stroke="#f97316" stroke-width="1" opacity="0.3"/>

  <!-- logo mark -->
  <g transform="translate(60 60) scale(1.1)">
    <line x1="160" y1="160" x2="222" y2="222" stroke="url(#ring)" stroke-width="26" stroke-linecap="round" transform="translate(-33 -33) scale(1.19)"/>
  </g>
  <circle cx="200" cy="200" r="86" fill="#0f172a"/>
  <g clip-path="url(#lensClip)" stroke="#475569" stroke-width="3.5" fill="none">
    <line x1="140" y1="166" x2="185" y2="188"/>
    <line x1="185" y1="188" x2="240" y2="160"/>
    <line x1="185" y1="188" x2="172" y2="242"/>
    <line x1="240" y1="160" x2="254" y2="220"/>
    <line x1="172" y1="242" x2="228" y2="252"/>
  </g>
  <g clip-path="url(#lensClip)" fill="#94a3b8">
    <circle cx="140" cy="166" r="7"/>
    <circle cx="240" cy="160" r="7"/>
    <circle cx="172" cy="242" r="7"/>
    <circle cx="254" cy="220" r="7"/>
    <circle cx="228" cy="252" r="7"/>
  </g>
  <polyline points="188,120 205,170 180,192 218,222 196,250 214,280"
            fill="none" stroke="#0f172a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#lensClip)"/>
  <polyline points="188,120 205,170 180,192 218,222 196,250 214,280"
            fill="none" stroke="url(#crack)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#lensClip)"/>
  <circle cx="185" cy="188" r="10" fill="#fbbf24"/>
  <circle cx="200" cy="200" r="86" fill="none" stroke="url(#ring)" stroke-width="17"/>

  <!-- wordmark -->
  <text x="340" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">FaultScout</text>
  <text x="344" y="248" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">Discover how your software system can fail.</text>

  <!-- pills -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="344" y="284" width="178" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="433" y="308" text-anchor="middle" fill="#a5b4fc">Claude Code plugin</text>
    <rect x="534" y="284" width="126" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="597" y="308" text-anchor="middle" fill="#67e8f9">Read-only</text>
    <rect x="672" y="284" width="172" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="758" y="308" text-anchor="middle" fill="#fcd34d">Evidence-backed</text>
  </g>
</svg>
